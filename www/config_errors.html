<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DATUM Gateway · Config</title>
	<link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
	<link rel="stylesheet" href="/assets/style.css?v=2">
</head>
<body>
<header class="topbar">
	<div class="wrap topbar-in">
		<div class="topbar-left">
			<a class="brand" href="/"><img src="/assets/icons/datum_logo.svg?v=2" alt="" width="20" height="20"><span>DATUM Gateway</span></a>
			<nav aria-label="Gateway sections">
				<a href="/">Status</a>
				<a href="/config" aria-current="page">Config</a>
				<a href="/clients">Clients</a>
				<a href="/threads">Threads</a>
				<a href="/coinbaser">Coinbaser</a>
			</nav>
		</div>
	</div>
</header>

<main class="wrap page">
	<div class="page-head">
		<div>
			<h1>Config</h1>
			<p class="lede">The changes could not all be saved.</p>
		</div>
	</div>
	<section class="panel" aria-labelledby="err-h">
		<div class="panel-head"><h2 id="err-h">Errors occurred</h2></div>
		<div class="errors">
			${*errors}
		</div>
	</section>
	<p class="note">Use your browser's Back button to return to your edits, or <a href="/config">reload the config page</a>.</p>
</main>

<footer class="foot">
	<div class="wrap foot-in">
		<span>DATUM Gateway · Decentralized Alternative Templates for Universal Mining</span>
		<span class="mono">BY OCEAN</span>
	</div>
</footer>
</body>
</html>
